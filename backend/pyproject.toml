[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vendorlens-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pypdf>=6,<7",
  "pymupdf>=1.26,<1.28",
  "python-multipart>=0.0.20,<0.1",
  "google-genai>=2.29,<3",
  "langchain>=1.4,<2",
  "langchain-google-genai>=4.4,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres==3.1.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL TEST_DATABASE_URL"]

[tool.setuptools.package-data]
"app.components.document_processing" = ["*.json", "*.swift"]
